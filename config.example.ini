; Настройки конкретной точки. Скопируйте в config.ini рядом с main.py
; и поправьте под себя. config.ini не входит в обновления и не затирается.

[database]
; SQL Server и имя базы
server = localhost\SQLEXPRESS
database = cafel

[cafe]
; Название в чеке
name = Викинг

[update]
; Автообновление при запуске (true/false)
enabled = true
url = https://github.com/uslulu/viking-pos/releases/latest/download/version.json
